name: sshca CI
run-name: "${{ inputs.pr_number && format('sshca CI PR #{0} {1}', inputs.pr_number, inputs.expected_head_sha) || github.event.pull_request.title || github.sha }}"

# `validate` checks the PR, its `Sshca-Issue` marker and, on a dispatched run, its `Sshca-Agent` line
# (a lane of `routing.lanes` of pipeline.yaml; a lane stored through the API in `lanes.json` is not on the
# runner and fails the check) with `governor-pr-issue` of the Governor package; `gate` runs `gate.command` of pipeline.yaml. A dispatched run (`expected_head_sha` set, run on
# `main`) merges `expected_head_sha` into `main` with `--no-ff` before testing; a conflict fails the
# `Merge conflict check` step, which the dispatcher reads. The run name of a dispatched run is
# `ci.run_title` of pipeline.yaml.
#
# Both jobs run on GitHub-hosted `ubuntu-latest`: the repository is public, and the organization's
# self-hosted runner group does not serve public repositories. `gate` installs `just`, uv and the Go
# version of `go.mod`, sets `GOVERNOR_JOBS` to the runner's core count, prepares the secret scan's
# detect-secrets with `just secrets-env`, then runs `just gate`. A PR from a fork receives no
# `GOVERNOR_PM_TOKEN`, so its `Check out the Governor package` step fails.
#
# On a push to `main` whose gate passes, `release-tag` reads the first `## [X.Y.Z]` heading of
# CHANGELOG.md (`[Unreleased]` and a prerelease such as `[X.Y.Z-rc.1]` do not match). When the tag
# `vX.Y.Z` does not exist on `origin`, it creates the tag on the pushed commit and pushes it with
# GITHUB_TOKEN. A tag pushed with GITHUB_TOKEN starts no workflow, so `release` calls release.yml with
# the tag. Runs on `main` are not cancelled in progress, so a later push cannot stop a release after
# its tag exists.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, 'queue/**']
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number of the dispatched exact-head gate
        required: false
        type: string
      expected_head_sha:
        description: Exact PR head commit to validate
        required: false
        type: string

concurrency:
  group: sshca-ci-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.expected_head_sha == '' && 1 || 0 }}

      - name: "Merge conflict check: PR head into main"
        if: inputs.expected_head_sha != ''
        env:
          HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git -c user.name=sshca-ci -c user.email=sshca-ci@users.noreply.github.com merge --no-ff --no-edit "$HEAD_SHA" || {
            echo "::error title=Merge conflict::PR head $HEAD_SHA conflicts with main $GITHUB_SHA; merge main into the branch"
            exit 1
          }

      - name: Validate PR metadata
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number(context.payload.pull_request?.number || "${{ inputs.pr_number }}");
            const expected = "${{ inputs.expected_head_sha }}";
            if (!Number.isSafeInteger(number) || number < 1 ||
                (!context.payload.pull_request && !/^[0-9a-f]{40}$/.test(expected))) {
              core.setFailed("A valid PR number and exact head SHA are required.");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: number,
            });
            if (!context.payload.pull_request && (pr.state !== "open" || pr.draft ||
                pr.head.repo?.full_name !== context.repo.owner + "/" + context.repo.repo ||
                pr.head.sha !== expected)) {
              core.setFailed("The dispatched head must be the current ready agent PR head.");
              return;
            }
            const fs = require("fs");
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/sshca-pr.json`, JSON.stringify(pr));

      - name: Check out the Governor package
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          repository: roselabs-io/governor
          token: ${{ secrets.GOVERNOR_PM_TOKEN }}
          path: .governor-package

      - name: Install uv
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: .governor-package/uv.lock

      - name: Check branch issue marker
        if: github.event_name == 'pull_request' || inputs.pr_number != ''
        env:
          PIPELINE_CONFIG: ${{ github.workspace }}/pipeline.yaml
        run: uv run --frozen --no-dev --project .governor-package governor-pr-issue "$RUNNER_TEMP/sshca-pr.json" ${{ github.event_name != 'pull_request' && '--dispatched' || '' }}

  gate:
    needs: validate
    name: Deterministic gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.expected_head_sha == '' && 1 || 0 }}

      - name: "Merge conflict check: PR head into main"
        if: inputs.expected_head_sha != ''
        env:
          HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git -c user.name=sshca-ci -c user.email=sshca-ci@users.noreply.github.com merge --no-ff --no-edit "$HEAD_SHA" || {
            echo "::error title=Merge conflict::PR head $HEAD_SHA conflicts with main $GITHUB_SHA; merge main into the branch"
            exit 1
          }

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set GOVERNOR_JOBS to the core count
        run: echo "GOVERNOR_JOBS=$(getconf _NPROCESSORS_ONLN)" >> "$GITHUB_ENV"

      - name: Prepare the secret scan
        run: just secrets-env

      - name: Gate
        run: just gate

  release-tag:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Tag a new CHANGELOG version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Create the tag of the newest CHANGELOG version
        id: tag
        run: |
          version=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n 1)
          if [ -z "$version" ]; then
            echo "CHANGELOG.md has no released version heading; nothing to release"
            exit 0
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag exists; nothing to release"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: release-tag
    if: needs.release-tag.outputs.tag != ''
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-tag.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
