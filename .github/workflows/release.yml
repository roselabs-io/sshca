# Release — on a pushed tag matching v*, or called by the `release`
# job of sshca-ci.yml with the tag it created as input `tag`.
#
# Builds the 6-platform release matrix, packages each as a
# .tar.gz (Unix) or .zip (Windows), generates a sha256 checksums
# manifest, and attaches everything to a GitHub Release with
# auto-generated release notes.
#
# For a tag that is not a prerelease, the homebrew job then sends a
# repository_dispatch event (type `formula-update`, payload `tool`, `tag`)
# to roselabs-io/homebrew-tools, whose workflow updates
# Formula/sshca.rb. GITHUB_TOKEN cannot reach another repository, so
# the dispatch uses the secret HOMEBREW_TAP_TOKEN, a token that can
# write to roselabs-io/homebrew-tools.
#
# TAG is input `tag` under workflow_call, where github.ref_name is the
# caller's branch, and github.ref_name on a tag push. It is the version
# injected via -ldflags, so `sshca --version` reports the tag rather
# than the source-default "0.1.0-dev", and it names the archives and
# the Release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: The tag to release, for example v0.2.0
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

permissions:
  contents: write  # required to create the GitHub Release

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w -X main.version=${TAG}" \
            -trimpath \
            -o dist/sshca${{ matrix.ext }} .

      - name: Package
        run: |
          cd dist
          archive_base="sshca-${TAG}-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${archive_base}.zip" sshca.exe
          else
            tar -czf "../${archive_base}.tar.gz" sshca
          fi
          cd ..
          ls -la "${archive_base}".*

      - uses: actions/upload-artifact@v4
        with:
          name: sshca-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshca-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum sshca-*-*.{tar.gz,zip} 2>/dev/null > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sshca-*-*.tar.gz
            dist/sshca-*-*.zip
            dist/checksums.txt
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}

  homebrew:
    name: Notify the Homebrew tap
    needs: release
    # A prerelease tag (one containing '-') does not update the formula.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to roselabs-io/homebrew-tools
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh api repos/roselabs-io/homebrew-tools/dispatches \
            -f event_type=formula-update \
            -f 'client_payload[tool]=sshca' \
            -f "client_payload[tag]=${TAG}"
