name: sshca PM sync

# Runs `governor-ticket-sync` of the Governor package with `tickets.*` of pipeline.yaml: every issue
# with a `sshca-pm` block is added to the organization project `Governor` (number 2, `tickets.project` of pipeline.yaml), with its fields set from the
# block. A PR's `Sshca-Issue: #N` line moves issue N to In progress (draft) or Review (ready), and a
# merge into `main` closes it as Done.
#
# `GOVERNOR_PM_TOKEN` is an organization secret holding a token that can read and write the organization's projects and
# the repository's issues, and read the Governor package repository; a repository secret of the same name overrides
# it. `github.token` cannot write an organization project.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sshca-pm.yml'
      - 'pipeline.yaml'
  issues:
    types: [opened, edited, closed, reopened, milestoned, demilestoned]
  pull_request:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:

concurrency:
  # Issue events share one group per repository and cancel the run before them; each run syncs every issue
  # updated since the last successful issue-event run, so a burst of edits costs one or two runs. A PR event
  # moves its issue from the event itself, so each PR has its own group and its runs are not cancelled.
  group: ${{ github.event_name == 'issues' && 'sshca-pm' || format('sshca-pm-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'issues' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    env:
      GOVERNOR_PM_TOKEN: ${{ secrets.GOVERNOR_PM_TOKEN }}
      PIPELINE_CONFIG: ${{ github.workspace }}/pipeline.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Check out the Governor package
        uses: actions/checkout@v7
        with:
          repository: roselabs-io/governor
          token: ${{ secrets.GOVERNOR_PM_TOKEN }}
          path: .governor-package

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-glob: .governor-package/uv.lock

      # The creation time of the last successful issue-event run; empty when there is none, and the sync then
      # reads the first 100 issues.
      - name: Find the last completed issue sync
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          since=$(gh run list --workflow sshca-pm.yml --event issues --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          echo "SSHCA_PM_SINCE=$since" >> "$GITHUB_ENV"

      - name: Synchronize GitHub project management metadata
        run: |
          set -o pipefail
          uv run --frozen --no-dev --project .governor-package governor-ticket-sync 2>&1 | tee "$RUNNER_TEMP/sshca-pm.log"

      - name: Report PM sync failure
        if: failure() && (github.event.issue.number || github.event.pull_request.number)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "sshca PM sync failed."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '~~~text'
            tail -c 5000 "$RUNNER_TEMP/sshca-pm.log" 2>/dev/null || echo "No sync log was produced."
            echo '~~~'
          } > "$RUNNER_TEMP/sshca-pm-comment.md"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/sshca-pm-comment.md"
