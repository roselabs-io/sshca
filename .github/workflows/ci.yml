# CI and release of the public repository. GitHub-hosted runners; the release job uses GITHUB_TOKEN only.
# A pull request or push to main runs `check` and `build`. A pushed tag `v*` also runs `release`:
# six archives, `checksums.txt` and a GitHub Release (a tag containing `-` is a prerelease).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/sshca${{ matrix.ext }} .
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          base="sshca-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${base}.zip" sshca.exe
          else
            tar -czf "../${base}.tar.gz" sshca
          fi
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: sshca-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sshca-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum sshca-*.tar.gz sshca-*.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sshca-*.tar.gz
            dist/sshca-*.zip
            dist/checksums.txt
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
